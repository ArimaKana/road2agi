<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 460" width="844" height="460"><rect width="844" height="460" fill="#0f1a26"/><rect x="20" y="40" width="400" height="190" rx="6" fill="none" stroke="#a9d3e6" stroke-width="1.5"/><text x="220.0" y="135.0" fill="#e8f2f8" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central">横屏：战斗</text><text x="20" y="30" fill="#e8f2f8" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" text-anchor="start">手机以横屏战斗为基准</text><rect x="480" y="40" width="150" height="320" rx="6" fill="none" stroke="#a9d3e6" stroke-width="1.5"/><text x="555.0" y="200.0" fill="#e8f2f8" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central">竖屏：只能进菜单</text><text x="480" y="30" fill="#e8f2f8" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" text-anchor="start">竖屏</text><rect x="650" y="120" width="170" height="120" rx="6" fill="none" stroke="#6fd0e0" stroke-width="1.5"/><text x="735.0" y="180.0" fill="#e8f2f8" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central">请把手机横过来
</text><text x="652" y="262" fill="#4a5a6c" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" text-anchor="start">进入战斗时提示旋转，并暂停</text><text x="20" y="262" fill="#4a5a6c" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" text-anchor="start">切到后台、失焦、手柄断开或旋转时：暂停战斗并清除按下状态</text><text x="20" y="282" fill="#4a5a6c" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" text-anchor="start">浏览器地址栏显隐时：按新的可视高度重新布局，不跳动</text><text x="20" y="302" fill="#4a5a6c" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" text-anchor="start">验证尺寸：844×390、960×540，以及刘海和手势条</text></svg>
